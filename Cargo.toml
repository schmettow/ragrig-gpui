[package]
name = "ragrig-gpui"
version = "0.9.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Reusable GPUI components for Ragrig RAG chat, citations, managed local services, and reference ingestion"
readme = "README.md"
repository = "https://github.com/schmettow/ragrig-gpui"
homepage = "https://github.com/schmettow/ragrig-gpui"
keywords = ["gpui", "rag", "ui", "chat", "llm"]
categories = ["gui", "text-processing"]
exclude = ["test_library/**", "PLAN.md"]

[features]
default = ["ragrig"]
ragrig = ["dep:ragrig", "dep:tokio"]
managed = [
    "dep:bollard",
    "dep:reqwest",
    "dep:futures-util",
    "dep:tokio",
    "ragrig",
]
grobid = [
    "managed",
    "dep:grobid-bibtex",
    "dep:biblatex",
]

[dependencies]
async-channel = "2"
blake3 = "1.5"
bollard = { version = "0.21", optional = true }
comrak = "0.22"
dirs = "5"
futures-util = { version = "0.3", optional = true }
gpui-kit = "0.7.3"
ragrig = { version = "1.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"], optional = true }
biblatex = { version = "0.12", optional = true }
grobid-bibtex = { version = "0.4", features = ["pipeline"], optional = true }

# GPUI's `prompt_for_paths` has no starting directory. On Linux the XDG
# portal supports one, so the path fields ask it directly.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
url = "2"

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
gpui-kit = { version = "0.7.3", features = ["test-support"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

# Development against the sibling checkout.  The `path` in the dependency is
# stripped when the crate is published.
# grobid-bibtex = { path = "../grobid-bibtex" }

[[example]]
name = "spike"
test = true

[[example]]
name = "gallery"
test = true

[[example]]
name = "ragchat"
required-features = ["ragrig"]
