[package]
name = "ragrig-gpui"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Reusable GPUI components for Ragrig RAG chat, citations, and reference ingestion"
readme = "README.md"
repository = "https://github.com/schmettow/ragrig-gpui"
homepage = "https://github.com/schmettow/ragrig-gpui"
keywords = ["gpui", "rag", "ui", "chat", "llm"]
categories = ["gui", "text-processing"]
exclude = ["test_library/**"]

[features]
default = ["ragrig"]
ragrig = ["dep:ragrig", "dep:tokio"]
grobid = [
    "dep:grobid-bibtex",
    "dep:biblatex",
    "dep:bollard",
    "dep:reqwest",
    "dep:futures-util",
    "ragrig",
]

[dependencies]
async-channel = "2"
blake3 = "1.5"
bollard = { version = "0.21", optional = true }
comrak = "0.22"
dirs = "5"
futures-util = { version = "0.3", optional = true }
gpui-kit = "0.7.3"
ragrig = { path = "../ragrig", version = "1.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"], optional = true }
biblatex = { version = "0.12", optional = true }
grobid-bibtex = { version = "0.3", features = ["pipeline"], optional = true }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
gpui-kit = { version = "0.7.3", features = ["test-support"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[[example]]
name = "spike"
test = true

[[example]]
name = "gallery"
test = true

[[example]]
name = "ragchat"
required-features = ["ragrig"]
